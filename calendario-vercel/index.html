<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fffbf5">
<title>Calendario 2027</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;600;800;900&display=swap" rel="stylesheet">
<style>
/* VOICE: tierno y alegre, una app de bolsillo hecha entre amigas
   IDEA: el calendario impreso convertido en app: portada al abrir y meses que se pasan deslizando como hojas
   PICTURE: la foto de cada mes entera arriba, la cuadrícula-pegatina debajo; en ordenador, la foto difuminada de fondo
   COLOUR and TYPE: cada hoja toma el color de su título; crema; Rubik 800/900
   LAYOUT: columna tipo móvil (máx 560px), carrusel horizontal a pantalla completa, barra inferior con botón + */
:root{color-scheme:light dark;--bg:light-dark(#fffbf5,#1b1826);--paper:light-dark(#fffbf5,#24202f);--txt:light-dark(#2b2738,#f4eee6);--soft:light-dark(#857e92,#a9a2b6);
  --c:#ff92b4;--ink:light-dark(var(--ink-l,#8f3b5c),var(--ink-d,#ff92b4));--on:#fff;--sh:light-dark(var(--sh-l,#a65f78),var(--sh-d,#120f19));--tint:16%;
  --top:env(safe-area-inset-top,0px);--bot:env(safe-area-inset-bottom,0px)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--txt);font:16px/1.5 Rubik,system-ui,sans-serif;overflow:hidden}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid var(--c);outline-offset:2px}

/* fondo difuminado (se ve en pantallas anchas) */
.blur{position:fixed;inset:-40px;background-size:cover;background-position:center;filter:blur(36px) saturate(1.2);opacity:.55;transition:background-image .5s}
.blur::after{content:"";position:absolute;inset:0;background:color-mix(in srgb,var(--bg) 55%,transparent)}

.app{position:relative;max-width:560px;height:100dvh;margin:0 auto;background:var(--bg);display:flex;flex-direction:column;overflow:hidden}
@media(min-width:620px){.app{height:calc(100dvh - 40px);margin-top:20px;border-radius:34px;border:3px solid var(--sh);box-shadow:10px 10px 0 var(--sh);transition:border-color .3s,box-shadow .3s}}

/* carrusel */
.track{flex:1;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior-x:contain}
.track::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;scroll-snap-align:start;scroll-snap-stop:always;overflow-y:auto;overflow-x:hidden;padding:calc(14px + var(--top)) 16px 120px;scrollbar-width:none}
.slide::-webkit-scrollbar{display:none}

.photo{position:relative;border-radius:24px;overflow:hidden;aspect-ratio:3/2;background:color-mix(in srgb,var(--c) 30%,var(--paper));border:3px solid var(--sh);box-shadow:6px 6px 0 var(--sh)}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.count{position:absolute;left:12px;bottom:12px;background:var(--paper);color:var(--ink);font-weight:800;font-size:13px;padding:4px 11px;border-radius:999px;border:2px solid var(--sh)}

.title{display:flex;align-items:baseline;gap:8px;margin:20px 2px 12px}
.title h2{margin:0;font-weight:900;font-size:34px;line-height:1.05;color:var(--ink)}
.title small{font-weight:900;font-size:18px;color:var(--c)}
.title .pl{margin-left:auto;font-size:13px;font-weight:800;color:var(--soft)}

.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.wd{background:var(--c);color:var(--on);border-radius:999px;text-align:center;font-weight:800;font-size:12px;padding:3px 0;margin-bottom:2px}
.day{position:relative;min-height:66px;border-radius:13px;border:2.5px solid var(--sh);background:color-mix(in srgb,var(--c) var(--tint),var(--paper));box-shadow:3px 3px 0 var(--sh);padding:5px 6px;display:flex;flex-direction:column;justify-content:flex-start;gap:3px;text-align:left;overflow:hidden;transition:transform .1s,box-shadow .1s}
.day:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--sh)}
.day .n{font-weight:800;font-size:17px;line-height:1;color:var(--ink)}
.day.we{background:var(--c)}.day.we .n{color:var(--on)}
.day.out{background:none;border:2px solid color-mix(in srgb,var(--c) 28%,transparent);box-shadow:none}
.day.out .n{color:color-mix(in srgb,var(--ink) 30%,transparent);font-weight:600}
.day.now{outline:3px solid var(--ink);outline-offset:2px}
.day.has,.day.has.we{background-color:var(--e);background-image:radial-gradient(color-mix(in srgb,#fff 45%,transparent) 1.2px,transparent 1.4px);background-size:7px 7px}
.day.has .n{color:#2b2738}
.ttl{font-size:9.5px;letter-spacing:-.2px;font-weight:800;line-height:1.15;color:#2b2738;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.badge{position:absolute;bottom:4px;right:4px;background:var(--paper);color:var(--ink);font-size:10px;font-weight:900;border-radius:999px;min-width:17px;height:17px;line-height:13px;padding:0 3px;text-align:center;border:1.5px solid var(--sh)}
.day.multi{border-width:3px;padding-bottom:5px}
.cs{display:flex;flex-direction:column;gap:2px;margin:0 -3px}
.c1{display:block;font-size:9.5px;font-weight:800;line-height:1.35;padding:0 3px;border-radius:5px;background:var(--e);color:#2b2738;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border:1.5px solid var(--sh)}
.c1.more{background:var(--paper);color:var(--ink);text-align:center;text-overflow:clip}
.mg .e2{background:linear-gradient(135deg,var(--e) 50%,var(--e2) 50%)}
@media(min-width:440px){.c1{font-size:11px}}
@media(min-width:440px){.day{min-height:78px}.ttl{font-size:11.5px;-webkit-line-clamp:3}}
/* el año entero */
.year{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.mm{border:2.5px solid var(--sh);box-shadow:3px 3px 0 var(--sh);border-radius:14px;padding:6px 4px 6px;background:color-mix(in srgb,var(--c) calc(var(--tint) * .7),var(--paper));text-align:center}
.mm h5{margin:0 0 4px;font-size:13px;font-weight:900;color:var(--ink)}
.mg{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));row-gap:1px}
.mg span{font-size:9.5px;font-weight:700;line-height:15px;height:15px;color:color-mix(in srgb,var(--txt) 75%,transparent);border-radius:50%}
.mg .w{color:var(--ink);font-weight:900}
.mg .e{background:var(--e);color:#2b2738;font-weight:900;box-shadow:0 0 0 1.5px var(--sh)}
.mg .h{color:var(--ink);font-weight:900;opacity:.7}
.ylegend{color:var(--soft);font-size:14px;margin:-4px 2px 12px}

h3.sec{font-weight:900;font-size:22px;margin:28px 2px 10px;color:var(--ink)}
.item{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:18px;border:2.5px solid var(--sh);background:var(--paper);box-shadow:3px 3px 0 var(--sh);margin-bottom:10px;width:100%;text-align:left}
.item .d{flex:none;width:52px;text-align:center;border-radius:13px;background:var(--e);color:#2b2738;padding:6px 0;font-weight:900;font-size:21px;line-height:1}
.item .d small{display:block;font-size:10px;font-weight:800;letter-spacing:.5px;margin-top:2px}
.item b{display:block;font-weight:800;line-height:1.3}.item span{color:var(--soft);font-size:14px}
.empty{color:var(--soft);padding:16px;border:2.5px dashed color-mix(in srgb,var(--c) 50%,transparent);border-radius:18px;text-align:center;font-size:15px}

/* portada */
.hello{text-align:center;margin:22px 0 4px}
.hello h1{margin:0;font-weight:900;font-size:clamp(38px,11vw,52px);line-height:1;color:var(--ink)}
.hello p{margin:8px 0 0;color:var(--soft);font-weight:600}
.cd{display:flex;justify-content:center;gap:10px;margin:18px 0 6px}
.cd div{background:var(--c);color:var(--on);border:2.5px solid var(--sh);box-shadow:3px 3px 0 var(--sh);border-radius:18px;padding:8px 14px;text-align:center;min-width:86px}
.cd b{display:block;font-weight:900;font-size:30px;line-height:1}.cd span{font-size:12px;font-weight:800}
.swipe{display:flex;align-items:center;justify-content:center;gap:8px;margin:18px auto 0;font-weight:800;color:var(--ink);background:color-mix(in srgb,var(--c) 22%,var(--paper));border:2.5px solid var(--sh);border-radius:999px;padding:10px 20px;box-shadow:3px 3px 0 var(--sh);min-height:48px}
.swipe svg{animation:nudge 1.4s ease-in-out infinite}
@keyframes nudge{50%{transform:translateX(6px)}}
.months{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.tile{position:relative;border-radius:18px;overflow:hidden;aspect-ratio:3/2;border:2.5px solid var(--sh2);box-shadow:3px 3px 0 var(--sh2);padding:0}
.tile img{width:100%;height:100%;object-fit:cover;display:block}
.tile .nb{position:absolute;right:7px;top:7px;background:var(--k);color:var(--kon);font-size:12px;font-weight:800;border-radius:999px;padding:1px 8px;border:2px solid var(--sh2)}

/* barra inferior */
.tabs{position:absolute;left:12px;right:12px;bottom:calc(12px + var(--bot));display:flex;align-items:center;justify-content:space-around;background:var(--paper);border:3px solid var(--sh);border-radius:26px;box-shadow:5px 5px 0 var(--sh);height:66px;padding:0 6px;transition:border-color .3s,box-shadow .3s}
.tab{display:flex;flex-direction:column;align-items:center;gap:1px;font-size:11px;font-weight:800;color:var(--soft);min-width:60px;min-height:52px;justify-content:center;border-radius:16px}
.tab svg{width:24px;height:24px}
.tab[aria-current=true]{color:var(--ink)}
.fab{width:62px;height:62px;border-radius:50%;background:var(--c);color:var(--on);border:3px solid var(--sh);box-shadow:4px 4px 0 var(--sh);display:grid;place-items:center;transform:translateY(-14px)}
.fab svg{width:30px;height:30px}
.fab:active{transform:translate(3px,-11px);box-shadow:1px 1px 0 var(--sh)}
.side{display:none}
@media(min-width:900px){.side{display:grid;position:fixed;top:50%;width:56px;height:56px;border-radius:50%;background:var(--paper);border:3px solid var(--sh);box-shadow:4px 4px 0 var(--sh);place-items:center;color:var(--ink);font-size:28px;font-weight:900;transform:translateY(-50%);z-index:2}
  .side.l{left:calc(50% - 360px)}.side.r{right:calc(50% - 360px)}}

/* hoja inferior */
.veil{position:fixed;inset:0;background:rgba(20,16,30,.45);opacity:0;pointer-events:none;transition:opacity .25s;z-index:10;display:flex;align-items:flex-end;justify-content:center}
.veil.open{opacity:1;pointer-events:auto}
.sheet{width:min(560px,100%);max-height:88dvh;overflow:auto;background:var(--paper);border:3px solid var(--sh);border-bottom:0;border-radius:28px 28px 0 0;padding:10px 18px calc(24px + var(--bot));transform:translateY(100%);transition:transform .3s cubic-bezier(.2,.9,.3,1)}
.veil.open .sheet{transform:none}
.grab{width:46px;height:5px;border-radius:9px;background:color-mix(in srgb,var(--ink) 35%,transparent);margin:2px auto 12px}
.sheet .top{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.sheet h4{margin:0;font-weight:900;font-size:28px;color:var(--ink);line-height:1.1}
.x{margin-left:auto;width:44px;height:44px;border-radius:50%;border:2.5px solid var(--sh);background:var(--c);color:var(--on);font-weight:900;font-size:20px;flex:none}
.dayev{display:flex;gap:8px;align-items:center;padding:10px 12px;border-radius:14px;background:color-mix(in srgb,var(--e) 35%,var(--paper));border:2px solid var(--e);margin-bottom:8px}
.dayev .t{flex:1}.dayev b{display:block;line-height:1.3}.dayev span{font-size:14px;color:var(--soft)}
.mini{border:2px solid var(--sh);background:var(--paper);border-radius:999px;padding:6px 11px;font-size:13px;font-weight:800;min-height:36px;color:var(--ink)}
form{display:grid;gap:12px;margin-top:14px;padding-top:14px;border-top:2.5px dashed color-mix(in srgb,var(--c) 45%,transparent)}
label{font-weight:800;font-size:14px;display:grid;gap:5px;color:var(--ink)}
input,textarea{font-size:16px;border:2.5px solid var(--sh);border-radius:14px;padding:10px 12px;background:color-mix(in srgb,var(--c) 8%,var(--paper));width:100%;min-height:46px}
textarea{resize:vertical;min-height:60px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.sw{display:flex;gap:9px;flex-wrap:wrap}
.sw button{width:36px;height:36px;border-radius:50%;background:var(--e);border:3px solid transparent}
.sw button[aria-pressed=true]{border-color:var(--sh);box-shadow:2px 2px 0 var(--sh);transform:scale(1.1)}
.go{border:3px solid var(--sh);background:var(--c);color:var(--on);font-weight:900;font-size:17px;border-radius:999px;padding:12px;box-shadow:4px 4px 0 var(--sh);min-height:50px}
.go:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--sh)}
.note{font-size:13px;color:var(--soft);text-align:center;margin:26px 0 0}
.toast{position:absolute;left:50%;bottom:calc(96px + var(--bot));transform:translate(-50%,20px);background:var(--ink);color:var(--paper);font-weight:800;font-size:14px;padding:8px 16px;border-radius:999px;opacity:0;transition:.25s;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}.track{scroll-behavior:auto}}
</style>
</head>
<body>
<div class="blur" id="blur"></div>
<button class="side l" id="sl" aria-label="Anterior">&lsaquo;</button>
<button class="side r" id="sr" aria-label="Siguiente">&rsaquo;</button>
<div class="app" id="app">
  <div class="track" id="track"></div>
  <nav class="tabs" aria-label="Navegación">
    <button class="tab" id="tHome" aria-current="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11l8-7 8 7v8a2 2 0 0 1-2 2h-3v-6h-6v6H6a2 2 0 0 1-2-2z"/></svg>Inicio</button>
    <button class="tab" id="tToday"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><rect x="3.5" y="5" width="17" height="15.5" rx="4"/><path d="M3.5 10h17M8 3v4M16 3v4"/><circle cx="12" cy="15" r="1.8" fill="currentColor"/></svg>Hoy</button>
    <button class="fab" id="fab" aria-label="Nuevo plan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
    <button class="tab" id="tList"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1.4" fill="currentColor"/><circle cx="4.5" cy="12" r="1.4" fill="currentColor"/><circle cx="4.5" cy="18" r="1.4" fill="currentColor"/></svg>Planes</button>
    <button class="tab" id="tBack"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg>Nosotras</button>
  </nav>
  <div class="toast" id="toast"></div>
</div>

<div class="veil" id="veil" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <div class="sheet" id="sheet">
    <div class="grab"></div>
    <div class="top"><h4 id="sheetTitle"></h4><button class="x" id="close" aria-label="Cerrar">&times;</button></div>
    <div id="sheetBody"></div>
    <form id="form">
      <label>¿Qué plan hay?<input id="fTitle" required maxlength="80" placeholder="Cumple, viaje, examen…"></label>
      <div class="row">
        <label>Día<input id="fDate" type="date" min="2027-01-01" max="2027-12-31" required></label>
        <label>Hora (opcional)<input id="fTime" type="time"></label>
      </div>
      <label>Color<div class="sw" id="sw"></div></label>
      <label>Notas<textarea id="fNote" maxlength="400" placeholder="Dónde, con quién, qué llevar…"></textarea></label>
      <button class="go" id="fGo" type="submit">Guardar plan</button>
    </form>
  </div>
</div>

<script>
{
const MESES=["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
const COL=["#f96b6e","#262c64","#71c9a4","#3c2cfe","#ff92b4","#fdecad","#da0328","#ff767a","#abb9ff","#ff5b70","#b7b9c8","#97c0c0"];
const EVC=["#ff92b4","#f96b6e","#fdd36a","#71c9a4","#97c0c0","#abb9ff","#c9a7f5"];
const DIAS=["L","M","X","J","V","S","D"];
const N=14; // 0 portada, 1-12 meses, 13 contraportada
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const hex=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
const mix=(a,b,t)=>"#"+a.map((v,i)=>Math.round(v*(1-t)+b[i]*t).toString(16).padStart(2,"0")).join("");
const lum=c=>(0.299*c[0]+0.587*c[1]+0.114*c[2])/255;
const pad=n=>String(n).padStart(2,"0");
const key=(m,d)=>`2027-${pad(m+1)}-${pad(d)}`;
const img=p=>`img/${pad(p)}.jpg`;
const colOf=p=>p<1||p>12?COL[4]:COL[p-1];

const now=new Date();
const in27=now.getFullYear()===2027;
const todayKey=in27?key(now.getMonth(),now.getDate()):"";
let events={},col=null,openDate=null,editId=null,pickColor=EVC[0],cur=0;

function vars(hc){
  const c=hex(hc),L=lum(c);
  const inkL=L<.55?hc:mix(c,[30,28,60],L>.65?.62:.4), inkD=L<.35?mix(c,[255,255,255],.6):hc;
  return {"--c":hc,"--ink-l":inkL,"--ink-d":inkD,"--sh-l":mix(c,[20,18,40],.35),"--sh-d":mix(c,[10,8,18],.7),"--on":L<.68?"#fff":inkL,"--tint":L<.8?"16%":"35%"};
}
const styleOf=hc=>Object.entries(vars(hc)).map(([k,v])=>`${k}:${v}`).join(";");
function applyRoot(hc){const r=document.documentElement.style;for(const[k,v]of Object.entries(vars(hc)))r.setProperty(k,v)}

function byDate(){const o={};for(const[id,e]of Object.entries(events))(o[e.date]??=[]).push({id,...e});
  for(const k in o)o[k].sort((a,b)=>(a.time||"99").localeCompare(b.time||"99"));return o}
const sorted=bd=>Object.keys(bd).sort().flatMap(k=>bd[k]);

function itemHTML(e){const[,mm,dd]=e.date.split("-");
  return `<button class="item" data-k="${esc(e.date)}"><span class="d" style="--e:${esc(e.color)}">${+dd}<small>${MESES[+mm-1].slice(0,3).toUpperCase()}</small></span>
  <span><b>${esc(e.title)}</b><span>${e.time?esc(e.time):"Todo el día"}${e.note?" · "+esc(e.note):""}</span></span></button>`}

function homeHTML(bd){
  const ups=sorted(bd).filter(e=>e.date>=(todayKey||"2027-01-01")).slice(0,4);
  const days=Math.ceil((new Date(2027,0,1)-new Date(now.getFullYear(),now.getMonth(),now.getDate()))/864e5);
  const cd=days>0
    ?`<div class="cd"><div><b>${days}</b><span>días para 2027</span></div><div><b>${Object.keys(events).length}</b><span>planes</span></div></div>`
    :in27?`<div class="cd"><div><b>${now.getDate()}</b><span>${MESES[now.getMonth()].toLowerCase()}</span></div><div><b>${(bd[todayKey]||[]).length}</b><span>planes hoy</span></div></div>`:"";
  const tiles=MESES.map((m,i)=>{const k=COL[i],v=vars(k),n=sorted(bd).filter(e=>e.date.startsWith(`2027-${pad(i+1)}`)).length;
    return `<button class="tile" data-go="${i+1}" style="--k:${k};--kon:${v["--on"]};--sh2:${v["--sh-l"]}" aria-label="${m}"><img src="${img(i+1)}" alt="" loading="lazy">${n?`<span class="nb">${n}</span>`:""}</button>`}).join("");
  return `<div class="photo"><img src="${img(0)}" alt="Portada 2027"></div>
    <div class="hello"><h1>Nuestro 2027</h1><p>Un año de planes juntas</p></div>${cd}
    <button class="swipe" data-go="${in27?now.getMonth()+1:1}">Desliza para ver ${in27?MESES[now.getMonth()].toLowerCase():"enero"}<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h13M13 6l6 6-6 6"/></svg></button>
    <h3 class="sec">Próximos planes</h3>${ups.map(itemHTML).join("")||`<div class="empty">Aún no hay planes. Toca + para apuntar el primero.</div>`}
    <h3 class="sec">Los meses</h3><div class="months">${tiles}</div>
    <p class="note" id="mode"></p>`;
}

function monthHTML(m,bd){
  const first=(new Date(2027,m,1).getDay()+6)%7,dim=new Date(2027,m+1,0).getDate(),prevDim=new Date(2027,m,0).getDate();
  const cells=Math.ceil((first+dim)/7)*7;let g=DIAS.map(d=>`<div class="wd">${d}</div>`).join("");
  for(let i=0;i<cells;i++){const d=i-first+1;
    if(d<1||d>dim){g+=`<div class="day out" aria-hidden="true"><span class="n">${d<1?prevDim+d:d-dim}</span></div>`;continue}
    const k=key(m,d),evs=bd[k]||[];
    const one=evs.length===1,many=evs.length>1;
    const st=one?` style="--e:${esc(evs[0].color)}"`:"";
    const shown=evs.length>3?evs.slice(0,2):evs;
    const inner=one?`<span class="ttl">${esc(evs[0].title)}</span>`
      :many?`<span class="cs">${shown.map(e=>`<span class="c1" style="--e:${esc(e.color)}">${esc(e.title)}</span>`).join("")}${evs.length>3?`<span class="c1 more">+${evs.length-2}</span>`:""}</span>`:"";
    g+=`<button class="day${i%7>=5?" we":""}${one?" has":""}${many?" multi":""}${k===todayKey?" now":""}"${st} data-k="${k}" aria-label="${d} de ${MESES[m]}${evs.length?", "+evs.length+(many?" planes":" plan"):""}"><span class="n">${d}</span>${inner}</button>`}
  const list=sorted(bd).filter(e=>e.date.startsWith(`2027-${pad(m+1)}`));
  return `<div class="photo"><img src="${img(m+1)}" alt="Foto de ${MESES[m]}" loading="lazy"><span class="count">${m+1} / 12</span></div>
    <div class="title"><h2>${MESES[m]}</h2><small>2027</small><span class="pl">${list.length?list.length+(list.length>1?" planes":" plan"):""}</span></div>
    <div class="grid">${g}</div>
    <h3 class="sec">Planes de ${MESES[m].toLowerCase()}</h3>${list.map(itemHTML).join("")||`<div class="empty">Nada apuntado todavía. Toca un día para añadir algo bonito.</div>`}`;
}
function yearHTML(bd){
  return MESES.map((m,i)=>{const first=(new Date(2027,i,1).getDay()+6)%7,dim=new Date(2027,i+1,0).getDate();
    let g=DIAS.map(d=>`<span class="h">${d}</span>`).join("")+"<span></span>".repeat(first);
    for(let d=1;d<=dim;d++){const evs=bd[key(i,d)]||[],w=(first+d-1)%7>=5;
      g+=evs.length?`<span class="e${evs.length>1?" e2":""}" style="--e:${esc(evs[0].color)};--e2:${esc((evs[1]||evs[0]).color)}">${d}</span>`:`<span${w?' class="w"':""}>${d}</span>`}
    return `<button class="mm" data-go="${i+1}" style="${styleOf(COL[i])}" aria-label="${m}"><h5>${m}</h5><div class="mg">${g}</div></button>`}).join("");
}
function backHTML(bd){
  return `<div class="photo"><img src="${img(13)}" alt="Por más años a tu lado" loading="lazy"></div>
  <div class="hello"><h1>Por más años a tu lado</h1><p>${Object.keys(events).length} planes apuntados en 2027</p></div>
  <h3 class="sec">El año entero</h3><p class="ylegend">Los días con plan salen en color. Toca un mes para abrirlo.</p><div class="year">${yearHTML(bd)}</div>
  <button class="swipe" data-go="0">Volver a la portada</button>`;
}

const track=$("track");
for(let p=0;p<N;p++){const s=document.createElement("section");s.className="slide";s.style.cssText=styleOf(colOf(p));s.setAttribute("aria-label",p===0?"Portada":p===13?"Contraportada":MESES[p-1]);track.appendChild(s)}
const slides=[...track.children];
let modeText="Conectando…";
function render(){const bd=byDate();slides.forEach((s,p)=>{s.innerHTML=p===0?homeHTML(bd):p===13?backHTML(bd):monthHTML(p-1,bd)});const md=$("mode");if(md)md.textContent=modeText}
function setMode(t){modeText=t;const md=$("mode");if(md)md.textContent=t}

function goTo(p,smooth=true){p=Math.max(0,Math.min(N-1,p));track.scrollTo({left:p*track.clientWidth,behavior:smooth?"smooth":"auto"})}
function onPage(p){if(p===cur&&$("blur").style.backgroundImage)return;cur=p;applyRoot(colOf(p));$("blur").style.backgroundImage=`url(${img(p)})`;
  $("tHome").setAttribute("aria-current",p===0);$("tBack").setAttribute("aria-current",p===13);$("tToday").setAttribute("aria-current",in27&&p===now.getMonth()+1)}
let raf=0;track.addEventListener("scroll",()=>{cancelAnimationFrame(raf);raf=requestAnimationFrame(()=>onPage(Math.round(track.scrollLeft/track.clientWidth)))});
new ResizeObserver(()=>goTo(cur,false)).observe(track);

function toast(t){const el=$("toast");el.textContent=t;el.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove("on"),1800)}

/* hoja inferior */
function swatches(){$("sw").innerHTML=EVC.map(c=>`<button type="button" style="--e:${c}" data-c="${c}" aria-label="Color" aria-pressed="${c===pickColor}"></button>`).join("")}
function resetForm(date){editId=null;$("fTitle").value="";$("fTime").value="";$("fNote").value="";$("fDate").value=date;pickColor=EVC[0];swatches();$("fGo").textContent="Guardar plan"}
function sheetTheme(hc){$("sheet").style.cssText=styleOf(hc)}
function openDay(k){openDate=k;const[,mm,dd]=k.split("-");sheetTheme(COL[+mm-1]);$("sheetTitle").textContent=`${+dd} de ${MESES[+mm-1]}`;$("form").hidden=false;resetForm(k);drawDay();show()}
function drawDay(){const evs=byDate()[openDate]||[];
  $("sheetBody").innerHTML=evs.length?evs.map(e=>`<div class="dayev" style="--e:${esc(e.color)}"><div class="t"><b>${esc(e.title)}</b><span>${e.time?esc(e.time):"Todo el día"}${e.note?" · "+esc(e.note):""}</span></div><button class="mini" data-edit="${esc(e.id)}">Editar</button><button class="mini" data-del="${esc(e.id)}">Borrar</button></div>`).join(""):`<div class="empty">Día libre… por ahora.</div>`}
function openNew(){const p=cur;const d=p>=1&&p<=12?(in27&&now.getMonth()===p-1?todayKey:key(p-1,1)):(todayKey||"2027-01-01");
  openDate=null;sheetTheme(colOf(p));$("sheetTitle").textContent="Nuevo plan";$("sheetBody").innerHTML="";$("form").hidden=false;resetForm(d);show();setTimeout(()=>$("fTitle").focus(),320)}
function openList(){openDate=null;sheetTheme(colOf(cur));$("sheetTitle").textContent="Todos los planes";$("form").hidden=true;
  const bd=byDate(),all=sorted(bd);
  $("sheetBody").innerHTML=all.length?MESES.map((m,i)=>{const l=all.filter(e=>e.date.startsWith(`2027-${pad(i+1)}`));return l.length?`<h3 class="sec" style="margin-top:14px">${m}</h3>${l.map(itemHTML).join("")}`:""}).join(""):`<div class="empty">Todavía no hay planes. Toca + para crear uno.</div>`;show()}
function show(){$("veil").classList.add("open")}
function hide(){$("veil").classList.remove("open");openDate=null}

/* guardado */
const LS="cal2027-events";
async function put(id,data){
  if(data)events[id]=data;else delete events[id];
  render();if(openDate)drawDay();
  if(col){try{data?await col.doc(id).set(data):await col.doc(id).delete();toast(data?"Plan guardado":"Plan borrado")}catch(e){toast(e?.code==="invalid_argument"?"No tienes permiso para editar":"No se pudo guardar")}}
  else{try{localStorage.setItem(LS,JSON.stringify(events))}catch{}toast(data?"Guardado en este dispositivo":"Plan borrado")}
}

$("form").addEventListener("submit",e=>{e.preventDefault();const title=$("fTitle").value.trim(),date=$("fDate").value;
  if(!title||!/^2027-\d\d-\d\d$/.test(date))return;
  const id=editId||("e"+Date.now().toString(36)+Math.random().toString(36).slice(2,6));
  put(id,{date,title,time:$("fTime").value,note:$("fNote").value.trim(),color:pickColor,updated:Date.now()});
  openDay(date);goTo(+date.slice(5,7));});
$("sw").addEventListener("click",e=>{const b=e.target.closest("[data-c]");if(b){pickColor=b.dataset.c;swatches()}});
$("sheetBody").addEventListener("click",e=>{
  const d=e.target.closest("[data-del]"),ed=e.target.closest("[data-edit]"),it=e.target.closest(".item");
  if(d){if(d.dataset.sure)put(d.dataset.del,null);else{d.dataset.sure=1;d.textContent="¿Seguro?"}return}
  if(ed){const ev=events[ed.dataset.edit];if(!ev)return;editId=ed.dataset.edit;$("fTitle").value=ev.title;$("fDate").value=ev.date;$("fTime").value=ev.time||"";$("fNote").value=ev.note||"";pickColor=ev.color;swatches();$("fGo").textContent="Guardar cambios";$("fTitle").focus();return}
  if(it){goTo(+it.dataset.k.slice(5,7),false);openDay(it.dataset.k)}
});
$("close").addEventListener("click",hide);
$("veil").addEventListener("click",e=>{if(e.target===$("veil"))hide()});
track.addEventListener("click",e=>{const g=e.target.closest("[data-go]");if(g){goTo(+g.dataset.go);return}const b=e.target.closest("[data-k]");if(b)openDay(b.dataset.k)});
$("tHome").addEventListener("click",()=>goTo(0));
$("tBack").addEventListener("click",()=>goTo(13));
$("tToday").addEventListener("click",()=>{if(in27){goTo(now.getMonth()+1)}else{goTo(1);toast("¡2027 empieza en enero!")}});
$("tList").addEventListener("click",openList);
$("fab").addEventListener("click",openNew);
$("sl").addEventListener("click",()=>goTo(cur-1));$("sr").addEventListener("click",()=>goTo(cur+1));
document.addEventListener("keydown",e=>{
  if($("veil").classList.contains("open")){if(e.key==="Escape")hide();return}
  if(e.target.matches("input,textarea"))return;
  if(e.key==="ArrowLeft")goTo(cur-1);if(e.key==="ArrowRight")goTo(cur+1);
});
/* arrastrar la hoja hacia abajo para cerrar */
{let y0=null;const sh=$("sheet");
 sh.addEventListener("touchstart",e=>{if(sh.scrollTop<=0)y0=e.touches[0].clientY},{passive:true});
 sh.addEventListener("touchmove",e=>{if(y0==null)return;const dy=e.touches[0].clientY-y0;if(dy>0)sh.style.transform=`translateY(${dy}px)`},{passive:true});
 sh.addEventListener("touchend",e=>{if(y0==null)return;const dy=e.changedTouches[0].clientY-y0;sh.style.transform="";y0=null;if(dy>110)hide()});}

try{events=JSON.parse(localStorage.getItem(LS)||"{}")||{}}catch{events={}}
render();onPage(0);
(async()=>{
  let db=null;try{db=await window.claude?.use?.("db")}catch{db=null}
  if(!db){setMode("Tus planes se guardan en este dispositivo.");return}
  col=db.collection("events");
  const t=setTimeout(()=>setMode("Tardando en cargar… puede que no veas los últimos cambios."),10000);
  col.onSnapshot(snap=>{const o={};
    snap.docs.forEach(d=>{const v=d.data();if(v&&typeof v.date==="string"&&typeof v.title==="string")o[d.id]=v});
    events=o;if(!snap.metadata?.fromCache){clearTimeout(t);setMode("Planes guardados en la nube · los verás en todos tus dispositivos.")}
    render();if(openDate)drawDay();
  },()=>{clearTimeout(t);col=null;setMode("Sin conexión: se guarda en este dispositivo.")});
})();
}
</script>
</body>
</html>
